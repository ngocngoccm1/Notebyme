name: notebyme
description: "Notes native app with local-first editing and background sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: 1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
