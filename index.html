<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>Notes | Ghi chú</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://clyshqnbxapwipacbaxd.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
    <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
    <section id="auth" class="login">
        <h1>Notes.</h1>
        <p>Ghi nhanh, đơn giản, đồng bộ giữa các thiết bị.</p>
        <form id="authForm"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input
                id="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" minlength="6"
                autocomplete="current-password" required><button id="loginBtn" class="btn primary" type="submit">Đăng
                nhập</button></form><button id="registerBtn" class="btn">Tạo tài khoản</button>
        <p id="authMsg" class="message" role="status" aria-live="polite">Đang kết nối máy chủ...</p>
        <button id="retryBtn" class="btn" type="button">Thử kết nối lại</button>
        <div class="muted">Dùng cùng một tài khoản trên mọi thiết bị.</div>
        <p><a class="muted" href="./admin/logs/">Nhật ký hệ thống</a></p>
    </section>
    <div id="app" class="hidden">
        <header>
            <h1>Notes.</h1>
            <div class="right"><span id="status" class="status">Đang tải...</span><button id="syncBtn" class="btn"
                    title="Đồng bộ">↻</button><button id="logoutBtn" class="btn">Thoát</button></div>
        </header>
        <div id="shell" class="shell">
            <aside>
                <div class="aside-top"><button id="addBtn" class="btn primary">+ Ghi chú mới</button><input id="search"
                        class="search" placeholder="Tìm ghi chú..." aria-label="Tìm ghi chú"></div>
                <div id="items" class="items"></div>
            </aside>
            <main class="editor">
                <div id="editorBar" class="editor-bar hidden"><button id="backBtn" class="btn mobile-back">← Danh
                        sách</button><button id="deleteBtn" class="btn">Xóa ghi chú</button></div>
                <div id="empty" class="placeholder">
                    <div><strong>Chưa chọn ghi chú</strong>
                        <p>Chọn một ghi chú hoặc tạo mới.</p>
                    </div>
                </div>
                <div id="editArea" class="editor-inner hidden"><input id="title" placeholder="Tiêu đề"
                        aria-label="Tiêu đề"><textarea id="body" placeholder="Bắt đầu viết..."
                        aria-label="Nội dung"></textarea></div>
            </main>
        </div>
    </div>
    <script type="module" src="./assets/app.js"></script>
<noscript>Vui lòng bật JavaScript để sử dụng ghi chú.</noscript>
</body>

</html>
